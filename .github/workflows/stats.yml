name: Update profile stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats card (public + private)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=hallatar&show_icons=true&count_private=true&include_all_commits=true&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=58A6FF&icon_color=58A6FF&text_color=c9d1d9
          path: assets/stats.svg
          token: ${{ secrets.README_TOKEN }}

      - name: Generate top languages card (public + private)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=hallatar&layout=compact&count_private=true&langs_count=8&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=58A6FF&text_color=c9d1d9
          path: assets/languages.svg
          token: ${{ secrets.README_TOKEN }}

      - name: Setup PHP for streak stats
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer

      - name: Generate streak card (public + private)
        env:
          TOKEN: ${{ secrets.README_TOKEN }}
        run: |
          git clone --depth=1 https://github.com/DenverCoder1/github-readme-streak-stats.git /tmp/streak
          cd /tmp/streak
          composer install --no-interaction --no-dev
          printf "TOKEN=%s\n" "$TOKEN" > .env
          php -S 127.0.0.1:8000 >/tmp/streak-php.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:8000/?user=hallatar" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:8000/?user=hallatar&theme=github-dark-blue&hide_border=true&background=0D1117&stroke=161B22&ring=58A6FF&fire=1F6FEB&currStreakNum=C9D1D9&sideNums=C9D1D9&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E" \
            -o "$GITHUB_WORKSPACE/assets/streak.svg"
          test -s "$GITHUB_WORKSPACE/assets/streak.svg"

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/languages.svg assets/streak.svg
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "Update profile stats (public + private)"
          git push
